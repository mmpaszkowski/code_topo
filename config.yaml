# Relative paths are resolved from this file's directory.
project_root: ../monogon

database:
  path: index.sqlite3
  save_after_each_step: true

steps:
  - type: clangd_yaml
    path: monogon-index.yaml
    recover_known_errors: true

  - type: clangd_lsp
    compile_commands_dir: ../monogon/build
    remove_compile_flags:
      - -fprofile-abs-path
    exclude_paths:
      - build/_deps/*

  - type: clang_ast
    compile_commands_dir: ../monogon/build
    executable: ./build/clang_ast/indexer-clang-ast
    timeout_seconds: 120
    remove_compile_flags:
      - -fprofile-abs-path
    exclude_paths:
      - build/_deps/*
